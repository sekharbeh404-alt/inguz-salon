<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INGUZ Salon | Luxury Unisex Salon &amp; Beauty Studio — Sambalpur</title>
  <meta name="description" content="INGUZ Salon, Sambalpur — a women-owned unisex salon led by Shivani Sharma welcoming both men and women for haircuts, global hair colour, highlights, smoothening, protein treatments, hair spa, skincare, professional makeup, nail art, and pedicures. Appointments required." />
  <meta name="theme-color" content="#14110F" />

  <!-- Editorial Luxury Fonts (with refined system fallbacks) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ================================================================
       INGUZ SALON — REDESIGNED ARCHITECTURAL LUXURY THEME
       Warm Pearl Ivory · Champagne Silk · Obsidian Espresso · Brushed Gold
    ================================================================ */
    :root {
      --obsidian: #14110F;
      --espresso: #1E1A17;
      --charcoal: #2B2521;
      --pearl: #FBF9F5;
      --silk: #F3ECE2;
      --sand: #E6DDD0;

      --ink: #171412;
      --ink-soft: #544C45;
      --ink-muted: #7F756C;
      --light-ink: #F8F4ED;
      --light-muted: #C4B9AC;

      --gold: #C49D62;
      --gold-bright: #DFC08B;
      --gold-deep: #946F38;
      --gold-wash: rgba(196, 157, 98, 0.14);

      --line-light: rgba(23, 20, 18, 0.1);
      --line-strong: rgba(23, 20, 18, 0.2);
      --line-dark: rgba(248, 244, 237, 0.14);
      --line-gold: rgba(196, 157, 98, 0.38);

      --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      --container: 1240px;
      --header-h: 82px;
      --radius-xs: 3px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-soft: 0 12px 36px rgba(20, 17, 15, 0.07);
      --shadow-deep: 0 28px 70px rgba(10, 8, 7, 0.28);
      --ease: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-h) + 12px);
    }

    body {
      font-family: var(--font-body);
      background-color: var(--pearl);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body.lock-scroll {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: 1.25rem;
    }

    @media (min-width: 768px) {
      .container {
        padding-inline: 2.25rem;
      }
    }

    .section {
      padding-block: 4.75rem;
    }

    @media (min-width: 992px) {
      .section {
        padding-block: 7rem;
      }
    }

    /* Typography System */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.01em;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 1rem;
    }

    .kicker::before {
      content: "";
      width: 28px;
      height: 1px;
      background-color: var(--gold);
    }

    .kicker--light {
      color: var(--gold-bright);
    }

    .kicker--light::before {
      background-color: var(--gold-bright);
    }

    .heading-xl {
      font-size: clamp(2.35rem, 4.4vw, 3.6rem);
      margin-bottom: 1.15rem;
    }

    .lead {
      font-size: 0.98rem;
      color: var(--ink-soft);
      line-height: 1.8;
      max-width: 580px;
    }

    .section-head {
      margin-bottom: 3.25rem;
    }

    .section-head--center {
      text-align: center;
      margin-inline: auto;
      max-width: 700px;
    }

    .section-head--center .kicker {
      justify-content: center;
    }

    .section-head--center .kicker::after {
      content: "";
      width: 28px;
      height: 1px;
      background-color: var(--gold);
    }

    .section-head--center .kicker--light::after {
      background-color: var(--gold-bright);
    }

    .section-head--center .lead {
      margin-inline: auto;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.98rem 1.85rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: var(--radius-xs);
      transition: transform var(--ease), background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease);
      white-space: nowrap;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn--gold {
      background-color: var(--gold);
      color: var(--obsidian);
      border: 1px solid var(--gold);
    }

    .btn--gold:hover {
      background-color: var(--gold-bright);
      border-color: var(--gold-bright);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(196, 157, 98, 0.28);
    }

    .btn--dark {
      background-color: var(--obsidian);
      color: var(--light-ink);
      border: 1px solid var(--obsidian);
    }

    .btn--dark:hover {
      background-color: var(--gold-deep);
      border-color: var(--gold-deep);
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .btn--ghost-light {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--light-ink);
      border: 1px solid rgba(248, 244, 237, 0.35);
      backdrop-filter: blur(8px);
    }

    .btn--ghost-light:hover {
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      transform: translateY(-2px);
    }

    .btn--outline {
      background-color: transparent;
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }

    .btn--outline:hover {
      border-color: var(--obsidian);
      background-color: var(--silk);
      transform: translateY(-2px);
    }

    .btn--sm {
      padding: 0.72rem 1.3rem;
      font-size: 0.72rem;
    }

    .btn--full {
      width: 100%;
    }

    /* ================================================================
       HEADER & CENTERED EDITORIAL NAVIGATION
    ================================================================ */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      z-index: 900;
      display: flex;
      align-items: center;
      color: var(--light-ink);
      background: linear-gradient(180deg, rgba(20, 17, 15, 0.72) 0%, rgba(20, 17, 15, 0) 100%);
      border-bottom: 1px solid rgba(248, 244, 237, 0.08);
      transition: background-color var(--ease), border-color var(--ease), color var(--ease), box-shadow var(--ease);
    }

    .header.is-solid {
      background: rgba(251, 249, 245, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--ink);
      border-bottom-color: var(--line-light);
      box-shadow: 0 6px 26px rgba(20, 17, 15, 0.06);
    }

    .header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand__title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.26em;
    }

    .brand__tag {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-top: 0.25rem;
      transition: color var(--ease);
    }

    .header.is-solid .brand__tag {
      color: var(--gold-deep);
    }

    .nav-group {
      display: none;
      align-items: center;
      gap: 2rem;
    }

    .nav-item {
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      position: relative;
      padding-block: 0.3rem;
      opacity: 0.88;
      transition: opacity var(--ease), color var(--ease);
    }

    .nav-item::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background-color: var(--gold);
      transition: width var(--ease);
    }

    .nav-item:hover {
      opacity: 1;
      color: var(--gold-bright);
    }

    .header.is-solid .nav-item:hover {
      color: var(--gold-deep);
    }

    .nav-item:hover::after {
      width: 100%;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-book {
      display: none;
    }

    .burger {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-xs);
      border: 1px solid rgba(248, 244, 237, 0.28);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: border-color var(--ease);
    }

    .header.is-solid .burger {
      border-color: var(--line-strong);
    }

    .burger span {
      width: 19px;
      height: 1.5px;
      background-color: currentColor;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .burger[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }

    .burger[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .burger[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    /* Fullscreen Dark Mobile Drawer */
    .drawer {
      position: fixed;
      inset: 0;
      z-index: 880;
      background-color: var(--obsidian);
      color: var(--light-ink);
      padding: calc(var(--header-h) + 2rem) 1.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-12px);
      transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
      overflow-y: auto;
    }

    .drawer.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .drawer-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .drawer-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      font-size: 2rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line-dark);
      transition: color var(--ease), padding-left var(--ease);
    }

    .drawer-link:hover {
      color: var(--gold-bright);
      padding-left: 0.45rem;
    }

    .drawer-foot {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .drawer-meta {
      font-size: 0.84rem;
      color: var(--light-muted);
    }

    @media (min-width: 1024px) {
      .nav-group {
        display: flex;
      }
      .header-book {
        display: inline-flex;
      }
      .burger,
      .drawer {
        display: none;
      }
    }

    /* ================================================================
       1. CINEMATIC FULL-BLEED HERO (salon-1.jpg)
    ================================================================ */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-color: var(--obsidian);
      color: var(--light-ink);
      overflow: hidden;
      padding-top: calc(var(--header-h) + 3.5rem);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.03);
      filter: brightness(0.62) contrast(1.06);
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(20, 17, 15, 0.88) 0%, rgba(20, 17, 15, 0.56) 52%, rgba(20, 17, 15, 0.34) 100%),
        linear-gradient(180deg, rgba(20, 17, 15, 0.55) 0%, rgba(20, 17, 15, 0.15) 40%, rgba(20, 17, 15, 0.92) 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      padding-block: 3rem 3.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: end;
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background-color: rgba(20, 17, 15, 0.62);
      border: 1px solid rgba(223, 192, 139, 0.35);
      color: var(--gold-bright);
      backdrop-filter: blur(8px);
    }

    .hero-title {
      font-size: clamp(2.85rem, 6.8vw, 5.4rem);
      font-weight: 400;
      line-height: 1.02;
      max-width: 780px;
      margin-bottom: 1.35rem;
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold-bright);
    }

    .hero-desc {
      font-size: 1.03rem;
      color: rgba(248, 244, 237, 0.86);
      max-width: 560px;
      line-height: 1.78;
      margin-bottom: 2.15rem;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .hero-feature-card {
      background-color: rgba(20, 17, 15, 0.72);
      border: 1px solid var(--line-gold);
      border-radius: var(--radius-sm);
      padding: 1.4rem 1.5rem;
      backdrop-filter: blur(12px);
      max-width: 340px;
    }

    .hero-feature-card__eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 0.55rem;
    }

    .hero-feature-card__rating {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-display);
      font-size: 1.75rem;
      color: var(--light-ink);
      margin-bottom: 0.25rem;
    }

    .hero-feature-card__sub {
      font-size: 0.82rem;
      color: var(--light-muted);
      line-height: 1.55;
    }

    .star {
      width: 18px;
      height: 18px;
      color: var(--gold-bright);
      flex-shrink: 0;
    }

    /* Bottom Architectural Info Bar */
    .hero-strip {
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(248, 244, 237, 0.14);
      background-color: rgba(20, 17, 15, 0.78);
      backdrop-filter: blur(12px);
    }

    .hero-strip-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      padding-block: 1.25rem;
    }

    .strip-cell__label {
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 0.2rem;
    }

    .strip-cell__val {
      font-size: 0.9rem;
      color: var(--light-ink);
      font-weight: 500;
    }

    @media (min-width: 992px) {
      .hero-inner {
        grid-template-columns: 1.3fr 0.7fr;
        padding-block: 4rem 4.25rem;
      }
      .hero-feature-card {
        justify-self: end;
      }
      .hero-strip-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1.5rem;
      }
    }

    /* ================================================================
       2. ABOUT SECTION — EDITORIAL COLLAGE (salon-3.jpg & salon-2.jpg)
    ================================================================ */
    .about {
      background-color: var(--pearl);
    }

    .about-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3.5rem;
      align-items: center;
    }

    .about-visuals {
      position: relative;
      padding-bottom: 2.5rem;
    }

    .about-main-photo {
      border-radius: var(--radius-sm);
      overflow: hidden;
      background-color: var(--charcoal);
      aspect-ratio: 16 / 11;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--line-light);
    }

    .about-main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-inset-photo {
      width: 54%;
      max-width: 270px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background-color: var(--charcoal);
      aspect-ratio: 4 / 3;
      border: 5px solid var(--pearl);
      box-shadow: var(--shadow-deep);
      position: absolute;
      right: 1rem;
      bottom: 0;
    }

    .about-inset-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .about-copy p {
      color: var(--ink-soft);
      font-size: 0.98rem;
      line-height: 1.85;
      margin-bottom: 1.15rem;
    }

    .founder-signature {
      margin-top: 2rem;
      padding: 1.4rem 1.6rem;
      background-color: var(--silk);
      border: 1px solid var(--line-light);
      border-left: 3px solid var(--gold);
      border-radius: var(--radius-xs);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .founder-signature__label {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-deep);
      font-weight: 600;
    }

    .founder-signature__name {
      font-family: var(--font-display);
      font-size: 1.85rem;
      color: var(--ink);
      line-height: 1.15;
    }

    .founder-signature__badge {
      font-size: 0.74rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background-color: var(--pearl);
      border: 1px solid var(--line-gold);
      color: var(--gold-deep);
      font-weight: 600;
    }

    @media (min-width: 992px) {
      .about-layout {
        grid-template-columns: 1.05fr 0.95fr;
        gap: 4.75rem;
      }
      .about-visuals {
        padding-bottom: 3.75rem;
        padding-right: 1.5rem;
      }
      .about-main-photo {
        aspect-ratio: 4 / 3.1;
      }
    }

    /* ================================================================
       3. LUXURY EDITORIAL SERVICES MENU
    ================================================================ */
    .services {
      background-color: var(--silk);
      border-top: 1px solid var(--line-light);
      border-bottom: 1px solid var(--line-light);
    }

    .menu-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 3rem;
    }

    .menu-tab {
      padding: 0.65rem 1.3rem;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      color: var(--ink-soft);
      transition: all var(--ease);
    }

    .menu-tab:hover {
      border-color: var(--ob
